<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receber Versículo do Dia</title>

    <!-- Mesmas fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(to bottom, #fdfcf7, #e8e2d6);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        h1 {
            font-family: 'Merriweather', serif;
            color: #5a3d1e;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        input:focus {
            outline: none;
            border-color: #5a3d1e;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary {
            background: #5a3d1e;
            color: white;
        }

        .btn-primary:hover {
            background: #7a5630;
        }

        .btn-secondary {
            background: #b23a3a;
            color: white;
        }

        .btn-secondary:hover {
            background: #8f2c2c;
        }

        .mensagem {
            margin-top: 20px;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Receba o Versículo do Dia 📖</h1>
        <p>
            Informe seus dados abaixo para receber diariamente uma mensagem
            edificante em seu WhatsApp.
        </p>

        <form id="formInscricao">
            <input type="text" id="nome" placeholder="Seu nome" required>
            <input type="tel" id="numero" placeholder="Seu número com DDD (Ex: 5511999999999)" required>

            <button type="submit" class="btn-primary">
                Quero Receber 🙏
            </button>
        </form>

        <button class="btn-secondary" onclick="pararRecebimento()">
            Parar de Receber ❌
        </button>

        <div class="mensagem" id="mensagem"></div>
    </div>

    <script>
        const form = document.getElementById("formInscricao");

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const nome = document.getElementById("nome").value;
            const numero = document.getElementById("numero").value;

            try {
                const resposta = await fetch("https://localhost:5001/api/inscritos/cadastrar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        nome: nome,
                        numeroWhatsApp: numero
                    })
                });

                if (resposta.ok) {
                    document.getElementById("mensagem").innerText =
                        "Cadastro realizado com sucesso! 🙌";
                } else {
                    document.getElementById("mensagem").innerText =
                        "Erro ao cadastrar.";
                }

            } catch (erro) {
                document.getElementById("mensagem").innerText =
                    "Servidor não encontrado.";
            }
        });

        async function pararRecebimento() {

            const numero = document.getElementById("numero").value;

            if (!numero) {
                document.getElementById("mensagem").innerText =
                    "Informe o número para cancelar.";
                return;
            }

            try {
                const resposta = await fetch("https://localhost:5001/api/inscritos/parar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        numeroWhatsApp: numero
                    })
                });

                if (resposta.ok) {
                    document.getElementById("mensagem").innerText =
                        "Você não receberá mais mensagens.";
                } else {
                    document.getElementById("mensagem").innerText =
                        "Erro ao cancelar.";
                }

            } catch (erro) {
                document.getElementById("mensagem").innerText =
                    "Servidor não encontrado.";
            }
        }
    </script>

</body>
</html>
