<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

<title>Versículo para Você</title>

<style>
body {
    margin: 0;
    font-family: 'Open Sans', sans-serif;
    background: linear-gradient(135deg, #fdf8ef, #e8dcc8);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: white;
    padding: 40px 25px;
    border-radius: 20px;
    text-align: center;
    max-width: 500px;
    width: 100%;
}

.container p{
    font-size: 18px;
}

h1 {
    font-size: 2em;
}

input {
    padding: 12px;
    width: 100%;
    border-radius: 10px;
    border: 1px solid #ccc;
    margin-top: 20px;
}

button {
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: #5a3d1e;
    color: white;
    cursor: pointer;
    width: 100%;
}

.resultado {
    margin-top: 20px;
}

.nome {
    font-weight: bold;
}

.botao2{
    position: absolute;
    top: 10px;
    left: 10px;
}

/* RESPONSIVO */
@media (max-width: 600px) {
    h1 { font-size: 1.5em; }
}
</style>
</head>

<body>
    <a href="index.html" class="botao2"><button>Inicio</button></a>
    <div class="container">
        <h1>📖 Palavra para você</h1>
        <p>Digite seu nome e receba uma mensagem especial:</p>

        <input type="text" id="nome" placeholder="Seu nome...">

        <br>
        <button onclick="gerarVersiculo()">Gerar versículo ✨</button>

        <div class="resultado" id="resultado"></div>
    </div>

<script>
const versiculos = [
    "Porque sou eu que conheço os planos que tenho para você, diz o Senhor. Jeremias 29:11",
    "O Senhor é o meu pastor, nada me faltará. Salmos 23:1",
    "Tudo posso naquele que me fortalece. Filipenses 4:13",
    "Entrega o teu caminho ao Senhor; confia nele, e ele tudo fará. Salmos 37:5",
    "Deus é o nosso refúgio e fortaleza. Salmos 46:1",
    "Se Deus é por nós, quem será contra nós? Romanos 8:31",
    "O choro pode durar uma noite, mas a alegria vem pela manhã. Salmos 30:5",
    "O Senhor lutará por vocês; tão somente acalmem-se. Êxodo 14:14",
    "Clame a mim e eu responderei e direi a você coisas grandiosas e insondáveis que você não conhece. Jeremias 33:3",
    "Bem-aventurados os que confiam no Senhor. Jeremias 17:7",
    "O Senhor é bom, um refúgio em tempos de angústia. Naum 1:7",
    "Buscai primeiro o Reino de Deus e a sua justiça, e todas essas coisas vos serão acrescentadas. Mateus 6:33",
    "Venham a mim, todos os que estão cansados e sobrecarregados, e eu lhes darei descanso. Mateus 11:28",
    "A minha graça te basta, pois o meu poder se aperfeiçoa na fraqueza. 2 Coríntios 12:9",
    "Se pedirmos alguma coisa segundo a vontade de Deus, ele nos ouve. 1 João 5:14",
    "Guardei no coração a tua palavra para não pecar contra ti. Salmos 119:11",
    "O Senhor firma os passos de um homem quando a sua conduta o agrada. Salmos 37:23",
    "Aqueles que esperam no Senhor renovam as suas forças. Isaías 40:31",
    "Não fui eu que lhe ordenei? Seja forte e corajoso! Josué 1:9",
    "O Senhor te abençoe e te guarde. Números 6:24",
    "Em paz me deito e logo adormeço, pois só tu, Senhor, me fazes viver em segurança. Salmos 4:8",
    "Deem graças ao Senhor, porque ele é bom. O seu amor dura para sempre. Salmos 136:1",
    "O Senhor está perto dos que têm o coração quebrantado. Salmos 34:18",
    "Bem-aventurados os puros de coração, pois verão a Deus. Mateus 5:8",
    "Deus é fiel e não permitirá que vocês sejam tentados além do que podem suportar. 1 Coríntios 10:13"
]

function gerarVersiculo() {
    let nome = document.getElementById("nome").value;
    let resultado = document.getElementById("resultado");

    if (nome === "") {
        resultado.innerHTML = "Digite seu nome primeiro 🙏";
        return;
    }

    let sorteio = Math.floor(Math.random() * versiculos.length);

    resultado.innerHTML = `
        <p class="nome">${nome},</p>
        <p>${versiculos[sorteio]}</p>
    `;
}
</script>

</body>
</html>
