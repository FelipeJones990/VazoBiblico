<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="parabola.css">

<title>O Seu Vaso</title>
</head>
<body>

<header class="hero">
    <button class="botao" onclick="window.location.href='versiculo.html'">Versículos</button>
    <h1>🏺 O Seu Vaso Espiritual</h1>
    <p>O que você tem colocado dentro do seu coração?</p>
</header>

<section class="vaso-section">

    <div class="vaso-container">

        <div class="palavra negativa p1">Imoralidade</div>
        <div class="palavra negativa p2">Ganância</div>
        <div class="palavra negativa p31">Inveja</div>
        <div class="palavra negativa p3">Orgulho</div>

        <div class="vaso" id="vaso">
            🏺
            <div class="interior" id="interior"></div>
        </div>

        <div class="palavra positiva p4">Fé</div>
        <div class="palavra positiva p5">Amor</div>
        <div class="palavra positiva p52">Perdão</div>
        <div class="palavra positiva p6">Propósito</div>

    </div>

    <div class="status" id="status">
        Seu vaso está vazio.
    </div>

    <button onclick="resetar()">Esvaziar Vaso</button>

</section>

<section class="reflexao">
    <h2>🌿 Momento de Reflexão</h2>
    <p>
        Pequenas escolhas diárias determinam o que enche nosso vaso.
        O que você tem permitido permanecer dentro de você?
    </p>
</section>

<script src="script.js"></script>
</body>
</html>
